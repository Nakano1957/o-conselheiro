<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O Conselheiro</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#020617">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f172a; display: flex; justify-content: center; align-items: center; height: 100dvh; color: #f8fafc; overflow: hidden; flex-direction: column; }
        .app-container { width: 100%; max-width: 420px; height: 100dvh; background: #1e293b; display: flex; flex-direction: column; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); border: 1px solid #334155; }
        @media (min-width: 640px) { .app-container { height: 90vh; border-radius: 16px; } header { border-top-left-radius: 16px; border-top-right-radius: 16px; } footer { border-bottom-left-radius: 16px; border-bottom-right-radius: 16px; } }
        
        /* Topo limpo e preparado para Patrocínio / Membros */
        header { background: #020617; padding: 12px 20px; border-bottom: 1px solid #334155; text-align: center; position: relative; }
        header h1 { font-size: 18px; color: #fbbf24; font-weight: bold; }
        .patrocinio-space { font-size: 11px; color: #64748b; margin-top: 2px; font-style: italic; }
        
        #btnInstalar { display: none; position: absolute; right: 15px; top: 10px; background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.2); padding: 3px 8px; border-radius: 20px; font-weight: bold; font-size: 10px; cursor: pointer; }
        
        .chat-box { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; background: #1e293b; }
        .msg { padding: 14px; border-radius: 16px; max-width: 85%; font-size: 15px; line-height: 1.5; word-wrap: break-word; }
        .msg-ia { background: rgba(51, 65, 85, 0.5); color: #f1f5f9; border: 1px solid rgba(255,255,255,0.05); align-self: flex-start; }
        .msg-user { background: rgba(251, 191, 36, 0.15); color: #fff; border: 1px solid rgba(251, 191, 36, 0.3); align-self: flex-end; margin-left: auto; }
        
        /* Rodapé Ajustado e Compacto */
        footer { padding: 12px; background: #020617; border-top: 1px solid #334155; }
        .input-container { display: flex; flex-direction: column; gap: 8px; }
        .input-group { display: flex; gap: 8px; align-items: center; }
        .input-group input { flex: 1; background: #1e293b; border: 1px solid #475569; border-radius: 12px; padding: 12px 14px; color: #fff; font-size: 15px; outline: none; }
        .input-group input:focus { border-color: #fbbf24; }
        
        /* Seletor Discreto com Seta ao lado do botão de enviar */
        .select-tradicao { background: #1e293b; color: #f1f5f9; border: 1px solid #475569; border-radius: 12px; padding: 11px 10px; font-size: 14px; outline: none; cursor: pointer; font-weight: 500; max-width: 130px; }
        .select-tradicao:focus { border-color: #fbbf24; }
        
        .btn-enviar { background: #fbbf24; color: #0f172a; border: none; border-radius: 12px; padding: 11px 18px; font-weight: bold; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        
        .loader { font-style: italic; color: #94a3b8; font-size: 14px; padding-left: 4px; }
        h4 { margin-top: 12px; margin-bottom: 4px; color: #fbbf24; font-size: 16px; }
        strong { color: #fcd34d; }
    </style>
</head>
<body>
    <div class="app-container">
        <header>
            <h1>O Conselheiro</h1>
            <!-- Espaço reservado e estratégico para monetização -->
            <div class="patrocinio-space">Espaço para Membro Parceiro / Patrocinador</div>
            <button id="btnInstalar">Instalar</button>
        </header>
        
        <div id="chat" class="chat-box">
            <div class="msg msg-ia">Olá, meu filho. O que está afligindo o seu coração hoje? Digite sua dúvida abaixo e escolha sua leitura de fé ao lado do botão de envio.</div>
        </div>
        
        <footer>
            <div class="input-container">
                <div class="input-group">
                    <input type="text" id="inp" placeholder="Desabafe aqui..." onkeypress="if(event.key==='Enter') send()">
                    
                    <!-- Menu dropdown discreto com a setinha nativa ao lado do botão -->
                    <select id="selectTradicao" class="select-tradicao">
                        <option value="Católica">🕊️ Católica</option>
                        <option value="Evangélica">📖 Evangélica</option>
                    </select>
                    
                    <button class="btn-enviar" onclick="send()">➔</button>
                </div>
            </div>
        </footer>
    </div>

    <script>
        let deferredPrompt;
        const btnInstalar = document.getElementById('btnInstalar');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            btnInstalar.style.display = 'block';
        });

        btnInstalar.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') btnInstalar.style.display = 'none';
                deferredPrompt = null;
            }
        });

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('data:text/javascript,self.addEventListener("fetch", (e) => {});');
        }

        function formatarTexto(texto) {
            return texto.replace(/\n/g, '<br>').replace(/#### \*\*([^*]+):\*\*/g, '<h4><b>$1:</b></h4>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
        }

        async function send() {
            const input = document.getElementById("inp"); const texto = input.value.trim(); if (!texto) return;
            const tradicaoSelecionada = document.getElementById("selectTradicao").value;
            
            input.value = ""; const chat = document.getElementById("chat");
            chat.innerHTML += `<div class="msg msg-user">${texto}</div>`;
            const loaderId = "loader_" + Date.now();
            chat.innerHTML += `<div id="${loaderId}" class="loader">O Conselheiro está refletindo...</div>`;
            chat.scrollTop = chat.scrollHeight;
            try {
                const response = await fetch("/api/conselho", {
                    method: "POST", headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ usuario_id: "user_mvp", pergunta: texto, tradicao: tradicaoSelecionada })
                });
                const data = await response.json(); document.getElementById(loaderId).remove();
                
                if (data && data.conselho) {
                    chat.innerHTML += `<div class="msg msg-ia">${formatarTexto(data.conselho)}</div>`;
                } else {
                    chat.innerHTML += `<div class="msg msg-ia">Não consegui formatar a resposta divina, tente novamente.</div>`;
                }
                chat.scrollTop = chat.scrollHeight;
            } catch (error) {
                document.getElementById(loaderId).innerHTML = "<span style='color:#ef4444;'>Houve uma interrupção na conexão devocional.</span>";
            }
        }
    </script>
</body>
</html>

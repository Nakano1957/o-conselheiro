<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O Conselheiro</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#020617">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f172a; display: flex; justify-content: center; align-items: center; height: 100vh; color: #f8fafc; overflow: hidden; flex-direction: column; }
        .app-container { width: 100%; max-width: 420px; height: 100vh; background: #1e293b; display: flex; flex-direction: column; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); border: 1px solid #334155; }
        @media (min-width: 640px) { .app-container { height: 85vh; border-radius: 16px; } header { border-top-left-radius: 16px; border-top-right-radius: 16px; } footer { border-bottom-left-radius: 16px; border-bottom-right-radius: 16px; } }
        header { background: #020617; padding: 15px 20px; border-bottom: 1px solid #334155; text-align: center; position: relative; }
        header h1 { font-size: 20px; color: #fbbf24; font-weight: bold; margin-bottom: 10px; }
        
        /* Seletor de Tradição Religiosa */
        .tradicao-selector { display: flex; gap: 8px; justify-content: center; margin-bottom: 2px; }
        .btn-tradicao { background: #334155; color: #94a3b8; border: 1px solid #475569; padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .btn-tradicao.active { background: #fbbf24; color: #0f172a; border-color: #fbbf24; box-shadow: 0 0 10px rgba(251, 191, 36, 0.3); }
        
        #btnInstalar { display: none; position: absolute; right: 15px; top: 12px; background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.2); padding: 4px 10px; border-radius: 20px; font-weight: bold; font-size: 11px; cursor: pointer; }
        
        .chat-box { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; background: #1e293b; }
        .msg { padding: 14px; border-radius: 16px; max-width: 85%; font-size: 15px; line-height: 1.5; word-wrap: break-word; }
        .msg-ia { background: rgba(51, 65, 85, 0.5); color: #f1f5f9; border: 1px solid rgba(255,255,255,0.05); align-self: flex-start; }
        .msg-user { background: rgba(251, 191, 36, 0.15); color: #fff; border: 1px solid rgba(251, 191, 36, 0.3); align-self: flex-end; margin-left: auto; }
        footer { padding: 16px; background: #020617; border-top: 1px solid #334155; }
        .input-group { display: flex; gap: 10px; }
        .input-group input { flex: 1; background: #1e293b; border: 1px solid #475569; border-radius: 12px; padding: 12px 16px; color: #fff; font-size: 15px; outline: none; }
        .input-group input:focus { border-color: #fbbf24; }
        .input-group button { background: #fbbf24; color: #0f172a; border: none; border-radius: 12px; padding: 0 20px; font-weight: bold; font-size: 18px; cursor: pointer; }
        .loader { font-style: italic; color: #94a3b8; font-size: 14px; padding-left: 4px; }
        h4 { margin-top: 12px; margin-bottom: 4px; color: #fbbf24; font-size: 16px; }
        strong { color: #fcd34d; }
    </style>
</head>
<body>
    <div class="app-container">
        <header>
            <h1>O Conselheiro</h1>
            <button id="btnInstalar">Instalar</button>
            <div class="tradicao-selector">
                <button id="btnCatolica" class="btn-tradicao active" onclick="selecionarTradicao('Católica')">🕊️ Cristã (Católica)</button>
                <button id="btnEvangelica" class="btn-tradicao" onclick="selecionarTradicao('Evangélica')">📖 Cristã (Evangélica)</button>
            </div>
        </header>
        <div id="chat" class="chat-box">
            <div class="msg msg-ia">Olá, meu filho. O que está afligindo o seu coração hoje? Selecione sua linha de leitura espiritual acima para conversarmos.</div>
        </div>
        <footer>
            <div class="input-group">
                <input type="text" id="inp" placeholder="Desabafe ou digite sua dúvida aqui..." onkeypress="if(event.key==='Enter') send()">
                <button onclick="send()">➔</button>
            </div>
        </footer>
    </div>

    <script>
        let tradicaoSelecionada = "Católica";
        let deferredPrompt;
        const btnInstalar = document.getElementById('btnInstalar');

        function selecionarTradicao(tipo) {
            tradicaoSelecionada = tipo;
            document.getElementById('btnCatolica').classList.remove('active');
            document.getElementById('btnEvangelica').classList.remove('active');
            if(tipo === 'Católica') {
                document.getElementById('btnCatolica').classList.add('active');
            } else {
                document.getElementById('btnEvangelica').classList.add('active');
            }
        }

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            btnInstalar.style.display = 'block';
        });

        btnInstalar.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') btnInstalar.style.display = 'none';
                deferredPrompt = null;
            }
        });

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('data:text/javascript,self.addEventListener("fetch", (e) => {});');
        }

        function formatarTexto(texto) {
            return texto.replace(/\n/g, '<br>').replace(/#### \*\*([^*]+):\*\*/g, '<h4><b>$1:</b></h4>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
        }

        async function send() {
            const input = document.getElementById("inp"); const texto = input.value.trim(); if (!texto) return;
            input.value = ""; const chat = document.getElementById("chat");
            chat.innerHTML += `<div class="msg msg-user">${texto}</div>`;
            const loaderId = "loader_" + Date.now();
            chat.innerHTML += `<div id="${loaderId}" class="loader">O Conselheiro está refletindo...</div>`;
            chat.scrollTop = chat.scrollHeight;
            try {
                const response = await fetch("/api/conselho", {
                    method: "POST", headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ usuario_id: "user_mvp", pergunta: texto, tradicao: tradicaoSelecionada })
                });
                const data = await response.json(); document.getElementById(loaderId).remove();
                
                if (data && data.conselho) {
                    chat.innerHTML += `<div class="msg msg-ia">${formatarTexto(data.conselho)}</div>`;
                } else {
                    chat.innerHTML += `<div class="msg msg-ia">Não consegui formatar a resposta divina, tente novamente.</div>`;
                }
                chat.scrollTop = chat.scrollHeight;
            } catch (error) {
                document.getElementById(loaderId).innerHTML = "<span style='color:#ef4444;'>Houve uma interrupção na conexão devocional.</span>";
            }
        }
    </script>
</body>
</html>
